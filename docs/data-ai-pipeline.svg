<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline data publik, computer vision, dan LLM CivicPulse</title>
  <desc id="desc">Diagram aliran CSV BNPB dan BPS ke JSON terolah, foto ke CLIP, serta fakta dan teks ke Groq LLM melalui server.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f0faf5"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#069550"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#153d2d}.title{font-size:42px;font-weight:700}.sub{font-size:21px;fill:#587364}.h{font-size:22px;font-weight:700}.b{font-size:17px;fill:#486456}.tag{font-size:15px;font-weight:700;fill:#087646}.box{fill:#fff;stroke:#b9dfcb;stroke-width:3}.dark{fill:#0a3d24;stroke:#0a3d24;stroke-width:3}.w{fill:#fff}.line{stroke:#069550;stroke-width:4;fill:none;marker-end:url(#a)}.orange{fill:#fff5e9;stroke:#efc795;stroke-width:3}
    </style>
  </defs>
  <rect width="1800" height="1050" rx="36" fill="url(#bg)"/>
  <text x="72" y="78" class="title">Data dan AI: dua jalur, pengaman tetap di server</text>
  <text x="72" y="118" class="sub">CLIP membaca gambar di API CivicPulse; LLM menerima fakta/teks yang dibutuhkan lewat Groq.</text>

  <rect x="72" y="184" width="370" height="210" rx="22" class="box"/>
  <text x="104" y="227" class="tag">DATA SUMBER</text><text x="104" y="269" class="h">BNPB · BPS · OSM</text>
  <text x="104" y="310" class="b"><tspan x="104">IRBI / Buku Risiko</tspan><tspan x="104" dy="28">DIBI (jika tersedia)</tspan><tspan x="104" dy="28">Kemiskinan + batas wilayah</tspan></text>
  <path d="M444 289H516" class="line"/>
  <rect x="534" y="184" width="390" height="210" rx="22" class="box"/>
  <text x="566" y="227" class="tag">PIPELINE DATA</text><text x="566" y="269" class="h">Raw → scripts → processed</text>
  <text x="566" y="310" class="b"><tspan x="566">CSV asli + atribusi</tspan><tspan x="566" dy="28">Normalisasi &amp; validasi schema</tspan><tspan x="566" dy="28">JSON per wilayah + periode</tspan></text>
  <path d="M926 289H998" class="line"/>
  <rect x="1016" y="184" width="340" height="210" rx="22" class="box"/>
  <text x="1048" y="227" class="tag">CORE + API</text><text x="1048" y="269" class="h">Konteks terukur</text>
  <text x="1048" y="310" class="b"><tspan x="1048">Skor + faktor + sumber</tspan><tspan x="1048" dy="28">Data hilang tidak ditebak</tspan><tspan x="1048" dy="28">Hasil bisa diaudit publik</tspan></text>
  <path d="M1358 289H1430" class="line"/>
  <rect x="1448" y="184" width="280" height="210" rx="22" class="dark"/>
  <text x="1480" y="227" class="tag" fill="#c4f23a">HASIL</text><text x="1480" y="269" class="h w">Peta &amp; dasbor</text>
  <text x="1480" y="310" class="b w"><tspan x="1480">Risiko, antrean,</tspan><tspan x="1480" dy="28">wilayah senyap,</tspan><tspan x="1480" dy="28">kesenjangan layanan</tspan></text>

  <rect x="72" y="478" width="790" height="420" rx="26" class="box"/>
  <text x="108" y="526" class="tag">JALUR COMPUTER VISION · POST /AI/FOTO</text>
  <rect x="108" y="562" width="214" height="176" rx="18" fill="#e9f7ee"/><text x="128" y="603" class="h">Foto browser</text><text x="128" y="644" class="b"><tspan x="128">≤960 px</tspan><tspan x="128" dy="28">JPEG · EXIF dibuang</tspan></text>
  <path d="M324 650H374" class="line"/>
  <rect x="390" y="562" width="214" height="176" rx="18" fill="#e9f7ee"/><text x="410" y="603" class="h">Hono API</text><text x="410" y="644" class="b"><tspan x="410">validasi tipe/ukuran</tspan><tspan x="410" dy="28">queue + rate limit</tspan></text>
  <path d="M606 650H656" class="line"/>
  <rect x="672" y="562" width="154" height="176" rx="18" class="dark"/><text x="692" y="603" class="h w">CLIP</text><text x="692" y="644" class="b w"><tspan x="692">q8 · ~90 MB</tspan><tspan x="692" dy="28">di-cache server</tspan></text>
  <text x="108" y="790" class="b">Output: kandidat kategori/detail atau tanda verifikasi. Hanya saran, bukan status/keputusan.</text>

  <rect x="930" y="478" width="798" height="420" rx="26" class="orange"/>
  <text x="966" y="526" class="tag">JALUR BAHASA · GROQ LLM</text>
  <rect x="966" y="562" width="214" height="176" rx="18" fill="#fff" stroke="#edc58d" stroke-width="2"/><text x="986" y="603" class="h">Fakta/teks</text><text x="986" y="644" class="b"><tspan x="986">Instruksi + data</tspan><tspan x="986" dy="28">+ input saat diminta</tspan></text>
  <path d="M1182 650H1232" class="line"/>
  <rect x="1248" y="562" width="214" height="176" rx="18" fill="#fff" stroke="#edc58d" stroke-width="2"/><text x="1268" y="603" class="h">Tokenisasi</text><text x="1268" y="644" class="b"><tspan x="1268">Input tokens →</tspan><tspan x="1268" dy="28">LLM → output tokens</tspan></text>
  <path d="M1464 650H1514" class="line"/>
  <rect x="1530" y="562" width="162" height="176" rx="18" class="dark"/><text x="1548" y="603" class="h w">Pengaman</text><text x="1548" y="644" class="b w"><tspan x="1548">cek angka</tspan><tspan x="1548" dy="28">fallback template</tspan></text>
  <text x="966" y="790" class="b">`gpt-oss-20b` · completion dibatasi per tugas · cache · rate limit · plafon 150.000 token/hari.</text>
  <text x="72" y="974" class="b">Foto tidak dikirim ke Groq untuk ringkasan. Input teks bebas dikirim ke provider hanya saat pengguna meminta tugas tersebut.</text>
</svg>
