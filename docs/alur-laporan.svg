<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Alur laporan CivicPulse dari warga sampai diverifikasi</title>
  <desc id="desc">Diagram lengkap alur kirim foto, validasi server, skor konteks, pelacakan, tindak lanjut instansi, dan verifikasi warga.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f0faf5"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#069550"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#123b2b}.title{font-size:44px;font-weight:700}.sub{font-size:23px;fill:#527062}.head{font-size:24px;font-weight:700}.body{font-size:18px;fill:#456455}.tag{font-size:16px;font-weight:700;fill:#087646}.box{fill:#fff;stroke:#b9dfcb;stroke-width:3}.dark{fill:#0a3d24;stroke:#0a3d24}.darktext{fill:#fff}.line{stroke:#069550;stroke-width:5;fill:none;marker-end:url(#arrow)}.dash{stroke:#7aa88b;stroke-width:3;stroke-dasharray:10 9;fill:none}
    </style>
  </defs>
  <rect width="1800" height="1040" rx="36" fill="url(#bg)"/>
  <text x="72" y="88" class="title">Dari laporan masuk sampai terbukti selesai</text>
  <text x="72" y="128" class="sub">Setiap permintaan melewati validasi server; laporan dapat dilacak tanpa akun.</text>

  <rect x="72" y="190" width="340" height="230" rx="24" class="box"/>
  <text x="104" y="236" class="tag">01 · WARGA</text><text x="104" y="278" class="head">Isi laporan</text>
  <text x="104" y="316" class="body"><tspan x="104">Foto + lokasi + kategori</tspan><tspan x="104" dy="28">Deskripsi dapat diedit</tspan><tspan x="104" dy="28">Tanpa nama / NIK / HP</tspan><tspan x="104" dy="28">ID perangkat acak</tspan></text>

  <path d="M414 304H482" class="line"/>
  <rect x="500" y="190" width="390" height="230" rx="24" class="box"/>
  <text x="532" y="236" class="tag">02 · API HONO</text><text x="532" y="278" class="head">Validasi &amp; konteks</text>
  <text x="532" y="316" class="body"><tspan x="532">Cek input, kategori, koordinat</tspan><tspan x="532" dy="28">Cari wilayah terdekat</tspan><tspan x="532" dy="28">Hitung laporan serupa</tspan><tspan x="532" dy="28">Terapkan batas &amp; hak akses</tspan></text>

  <path d="M892 304H960" class="line"/>
  <rect x="978" y="190" width="360" height="230" rx="24" class="box"/>
  <text x="1010" y="236" class="tag">03 · PACKAGES/CORE</text><text x="1010" y="278" class="head">Skor terbuka</text>
  <text x="1010" y="316" class="body"><tspan x="1010">IRBI/RBI + DIBI + BPS</tspan><tspan x="1010" dy="28">+ laporan serupa sekitar</tspan><tspan x="1010" dy="28">Skor 0–100 + alasan faktor</tspan><tspan x="1010" dy="28">Disimpan dengan versi rumus</tspan></text>

  <path d="M1340 304H1408" class="line"/>
  <rect x="1426" y="190" width="302" height="230" rx="24" class="dark"/>
  <text x="1458" y="236" class="tag" fill="#c4f23a">04 · SIMPAN</text><text x="1458" y="278" class="head darktext">Kode &amp; linimasa</text>
  <text x="1458" y="316" class="body darktext"><tspan x="1458">CP-TAHUN-NOMOR</tspan><tspan x="1458" dy="28">Status: Diterima</tspan><tspan x="1458" dy="28">GET /laporan/:kode</tspan><tspan x="1458" dy="28">Bisa dilacak publik</tspan></text>

  <path d="M1577 422V492H1345" class="line"/>
  <rect x="1018" y="510" width="420" height="215" rx="24" class="box"/>
  <text x="1050" y="556" class="tag">05 · ADMIN KAB/KOTA</text><text x="1050" y="598" class="head">Menangani laporan</text>
  <text x="1050" y="638" class="body"><tspan x="1050">Diterima → Diproses → Klaim selesai</tspan><tspan x="1050" dy="28">Tulis tanggapan &amp; bukti tindak lanjut</tspan></text>
  <path d="M1016 616H910" class="line"/>
  <rect x="480" y="510" width="410" height="215" rx="24" class="box"/>
  <text x="512" y="556" class="tag">06 · PUBLIK / WARGA</text><text x="512" y="598" class="head">Pantau &amp; dukung</text>
  <text x="512" y="638" class="body"><tspan x="512">+1 warga lain → skor dihitung ulang</tspan><tspan x="512" dy="28">Peta, detail, kode lacak, linimasa</tspan></text>
  <path d="M478 616H386" class="line"/>
  <rect x="72" y="510" width="292" height="215" rx="24" class="dark"/>
  <text x="104" y="556" class="tag" fill="#c4f23a">07 · VERIFIKASI</text><text x="104" y="598" class="head darktext">Bukti warga</text>
  <text x="104" y="638" class="body darktext"><tspan x="104">Foto ≤200 m</tspan><tspan x="104" dy="28">≥3 suara sah</tspan><tspan x="104" dy="28">Beres / dibuka ulang</tspan></text>

  <path d="M218 727V820H706" class="dash"/><path d="M218 727V820H1090" class="dash"/>
  <rect x="496" y="830" width="530" height="126" rx="22" fill="#e8f7ee" stroke="#a6d9ba" stroke-width="3"/>
  <text x="528" y="875" class="head">Terverifikasi warga</text><text x="528" y="914" class="body">≥3 bukti sah dan mayoritas menyatakan “beres”.</text>
  <rect x="1070" y="830" width="658" height="126" rx="22" fill="#fff4e8" stroke="#f1c798" stroke-width="3"/>
  <text x="1102" y="875" class="head">Dibuka ulang</text><text x="1102" y="914" class="body">Mayoritas menyatakan “belum” atau 14 hari tanpa bukti cukup.</text>
</svg>
